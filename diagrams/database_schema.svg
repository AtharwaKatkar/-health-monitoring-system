<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="1400" height="1000" fill="white"/>
  <defs>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F4F8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Database Schema</text>
  
  <!-- Patients Table -->
  <rect x="50" y="80" width="300" height="200" rx="5" fill="url(#tableGrad)" stroke="#4A90E2" stroke-width="2"/>
  <rect x="50" y="80" width="300" height="35" rx="5" fill="url(#headerGrad)"/>
  <text x="200" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">patients</text>
  
  <line x1="50" y1="115" x2="350" y2="115" stroke="#4A90E2" stroke-width="1"/>
  
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">id (PK)</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">name</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="12" fill="#333">dob</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="12" fill="#333">age</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="12" fill="#333">conditions</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="12" fill="#333">created_at</text>
  
  <text x="280" y="140" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="280" y="160" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(100)</text>
  <text x="280" y="180" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Date</text>
  <text x="280" y="200" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="280" y="220" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Text</text>
  <text x="280" y="240" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  
  <!-- Recordings Table -->
  <rect x="450" y="80" width="300" height="200" rx="5" fill="url(#tableGrad)" stroke="#4A90E2" stroke-width="2"/>
  <rect x="450" y="80" width="300" height="35" rx="5" fill="url(#headerGrad)"/>
  <text x="600" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">recordings</text>
  
  <line x1="450" y1="115" x2="750" y2="115" stroke="#4A90E2" stroke-width="1"/>
  
  <text x="460" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">id (PK)</text>
  <text x="460" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">patient_id (FK)</text>
  <text x="460" y="180" font-family="Arial, sans-serif" font-size="12" fill="#333">path</text>
  <text x="460" y="200" font-family="Arial, sans-serif" font-size="12" fill="#333">device_id</text>
  <text x="460" y="220" font-family="Arial, sans-serif" font-size="12" fill="#333">timestamp</text>
  <text x="460" y="240" font-family="Arial, sans-serif" font-size="12" fill="#333">processed</text>
  <text x="460" y="260" font-family="Arial, sans-serif" font-size="12" fill="#333">created_at</text>
  
  <text x="680" y="140" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="680" y="160" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="680" y="180" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(255)</text>
  <text x="680" y="200" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(50)</text>
  <text x="680" y="220" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  <text x="680" y="240" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Boolean</text>
  <text x="680" y="260" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  
  <!-- Features Table -->
  <rect x="850" y="80" width="300" height="160" rx="5" fill="url(#tableGrad)" stroke="#4A90E2" stroke-width="2"/>
  <rect x="850" y="80" width="300" height="35" rx="5" fill="url(#headerGrad)"/>
  <text x="1000" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">features</text>
  
  <line x1="850" y1="115" x2="1150" y2="115" stroke="#4A90E2" stroke-width="1"/>
  
  <text x="860" y="140" font-family="Arial, sans-serif" font-size="12" fill="#333">id (PK)</text>
  <text x="860" y="160" font-family="Arial, sans-serif" font-size="12" fill="#333">recording_id (FK)</text>
  <text x="860" y="180" font-family="Arial, sans-serif" font-size="12" fill="#333">feature_json</text>
  <text x="860" y="200" font-family="Arial, sans-serif" font-size="12" fill="#333">created_at</text>
  
  <text x="1080" y="140" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="1080" y="160" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="1080" y="180" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">JSON</text>
  <text x="1080" y="200" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  
  <!-- Metrics Table -->
  <rect x="50" y="350" width="300" height="220" rx="5" fill="url(#tableGrad)" stroke="#4A90E2" stroke-width="2"/>
  <rect x="50" y="350" width="300" height="35" rx="5" fill="url(#headerGrad)"/>
  <text x="200" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">metrics</text>
  
  <line x1="50" y1="385" x2="350" y2="385" stroke="#4A90E2" stroke-width="1"/>
  
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="12" fill="#333">id (PK)</text>
  <text x="60" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">recording_id (FK)</text>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">respiration_rate</text>
  <text x="60" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">heart_rate</text>
  <text x="60" y="490" font-family="Arial, sans-serif" font-size="12" fill="#333">hrv</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">activity_label</text>
  <text x="60" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333">risk_score</text>
  <text x="60" y="550" font-family="Arial, sans-serif" font-size="12" fill="#333">created_at</text>
  
  <text x="280" y="410" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="280" y="430" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="280" y="450" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Float</text>
  <text x="280" y="470" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Float</text>
  <text x="280" y="490" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Float</text>
  <text x="280" y="510" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(50)</text>
  <text x="280" y="530" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Float</text>
  <text x="280" y="550" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  
  <!-- Alerts Table -->
  <rect x="450" y="350" width="300" height="200" rx="5" fill="url(#tableGrad)" stroke="#4A90E2" stroke-width="2"/>
  <rect x="450" y="350" width="300" height="35" rx="5" fill="url(#headerGrad)"/>
  <text x="600" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">alerts</text>
  
  <line x1="450" y1="385" x2="750" y2="385" stroke="#4A90E2" stroke-width="1"/>
  
  <text x="460" y="410" font-family="Arial, sans-serif" font-size="12" fill="#333">id (PK)</text>
  <text x="460" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">patient_id (FK)</text>
  <text x="460" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">metric_id (FK)</text>
  <text x="460" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">level</text>
  <text x="460" y="490" font-family="Arial, sans-serif" font-size="12" fill="#333">message</text>
  <text x="460" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">created_at</text>
  
  <text x="680" y="410" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="680" y="430" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="680" y="450" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="680" y="470" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(20)</text>
  <text x="680" y="490" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Text</text>
  <text x="680" y="510" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  
  <!-- Model Runs Table -->
  <rect x="850" y="350" width="300" height="220" rx="5" fill="url(#tableGrad)" stroke="#4A90E2" stroke-width="2"/>
  <rect x="850" y="350" width="300" height="35" rx="5" fill="url(#headerGrad)"/>
  <text x="1000" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">model_runs</text>
  
  <line x1="850" y1="385" x2="1150" y2="385" stroke="#4A90E2" stroke-width="1"/>
  
  <text x="860" y="410" font-family="Arial, sans-serif" font-size="12" fill="#333">id (PK)</text>
  <text x="860" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">type</text>
  <text x="860" y="450" font-family="Arial, sans-serif" font-size="12" fill="#333">params_json</text>
  <text x="860" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">metrics_json</text>
  <text x="860" y="490" font-family="Arial, sans-serif" font-size="12" fill="#333">artifact_path</text>
  <text x="860" y="510" font-family="Arial, sans-serif" font-size="12" fill="#333">status</text>
  <text x="860" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333">created_at</text>
  
  <text x="1080" y="410" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">Integer</text>
  <text x="1080" y="430" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(50)</text>
  <text x="1080" y="450" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">JSON</text>
  <text x="1080" y="470" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">JSON</text>
  <text x="1080" y="490" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(255)</text>
  <text x="1080" y="510" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">String(20)</text>
  <text x="1080" y="530" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="end">DateTime</text>
  
  <!-- Relationship Lines -->
  <!-- Patients to Recordings -->
  <path d="M 200 280 L 600 280" stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="275" font-family="Arial, sans-serif" font-size="10" fill="#FF6B6B" text-anchor="middle">1:N</text>
  
  <!-- Recordings to Features -->
  <path d="M 750 180 L 850 180" stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="800" y="175" font-family="Arial, sans-serif" font-size="10" fill="#FF6B6B" text-anchor="middle">1:N</text>
  
  <!-- Recordings to Metrics -->
  <path d="M 600 280 L 200 350" stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="10" fill="#FF6B6B" text-anchor="middle">1:1</text>
  
  <!-- Patients to Alerts -->
  <path d="M 200 280 L 600 350" stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="10" fill="#FF6B6B" text-anchor="middle">1:N</text>
  
  <!-- Metrics to Alerts -->
  <path d="M 350 460 L 450 460" stroke="#FF6B6B" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="400" y="455" font-family="Arial, sans-serif" font-size="10" fill="#FF6B6B" text-anchor="middle">1:N</text>
  
  <!-- Legend -->
  <rect x="50" y="650" width="500" height="120" rx="5" fill="#F5F5F5" stroke="#333" stroke-width="1"/>
  <text x="300" y="675" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Legend</text>
  
  <rect x="70" y="690" width="15" height="15" fill="#4A90E2"/>
  <text x="95" y="702" font-family="Arial, sans-serif" font-size="12" fill="#333">Primary Key (PK)</text>
  
  <rect x="70" y="715" width="15" height="15" fill="#FF6B6B"/>
  <text x="95" y="727" font-family="Arial, sans-serif" font-size="12" fill="#333">Foreign Key (FK)</text>
  
  <line x1="250" y1="690" x2="280" y2="690" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="295" y="695" font-family="Arial, sans-serif" font-size="12" fill="#333">Relationship</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B6B" />
    </marker>
  </defs>
</svg>




