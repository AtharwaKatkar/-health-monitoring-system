<svg width="1600" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="1600" height="1200" fill="white"/>
  <defs>
    <linearGradient id="getGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#44A08D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7B731;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A84A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="800" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">REST API Endpoints</text>
  
  <!-- Base URL -->
  <rect x="50" y="60" width="300" height="50" rx="5" fill="url(#headerGrad)" stroke="#5A3F8A" stroke-width="2"/>
  <text x="200" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Base URL</text>
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">http://localhost:5001/api/v1</text>
  
  <!-- Authentication -->
  <rect x="400" y="60" width="400" height="50" rx="5" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <text x="600" y="85" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Authentication</text>
  <text x="600" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Bearer Token: Authorization: Bearer dev-token-123</text>
  
  <!-- Patient Management Section -->
  <rect x="50" y="150" width="700" height="200" rx="10" fill="#F8F9FA" stroke="#333" stroke-width="2"/>
  <rect x="50" y="150" width="700" height="40" rx="10" fill="url(#headerGrad)"/>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Patient Management</text>
  
  <!-- GET /patients -->
  <rect x="80" y="210" width="300" height="60" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="230" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /patients</text>
  <text x="230" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Get all patients</text>
  
  <!-- POST /patients -->
  <rect x="420" y="210" width="300" height="60" rx="5" fill="url(#postGrad)" stroke="#E8A84A" stroke-width="2"/>
  <text x="570" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">POST /patients</text>
  <text x="570" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Create new patient</text>
  
  <!-- GET /patients/{id} -->
  <rect x="80" y="290" width="300" height="50" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="230" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /patients/{id}</text>
  <text x="230" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Get patient by ID</text>
  
  <!-- GET /patients/{id}/alerts -->
  <rect x="420" y="290" width="300" height="50" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="570" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /patients/{id}/alerts</text>
  <text x="570" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Get patient alerts</text>
  
  <!-- Data Ingestion Section -->
  <rect x="50" y="400" width="700" height="250" rx="10" fill="#F8F9FA" stroke="#333" stroke-width="2"/>
  <rect x="50" y="400" width="700" height="40" rx="10" fill="url(#headerGrad)"/>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Data Ingestion</text>
  
  <!-- GET /recordings -->
  <rect x="80" y="460" width="300" height="50" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="230" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /recordings</text>
  <text x="230" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">List all recordings</text>
  
  <!-- POST /recordings -->
  <rect x="420" y="460" width="300" height="50" rx="5" fill="url(#postGrad)" stroke="#E8A84A" stroke-width="2"/>
  <text x="570" y="485" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">POST /recordings</text>
  <text x="570" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Upload CSI recording</text>
  
  <!-- POST /recordings/{id}/process -->
  <rect x="80" y="530" width="300" height="50" rx="5" fill="url(#postGrad)" stroke="#E8A84A" stroke-width="2"/>
  <text x="230" y="555" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">POST /recordings/{id}/process</text>
  <text x="230" y="575" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Process recording</text>
  
  <!-- GET /recordings/{id}/metrics -->
  <rect x="420" y="530" width="300" height="50" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="570" y="555" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /recordings/{id}/metrics</text>
  <text x="570" y="575" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Get recording metrics</text>
  
  <!-- GET /recordings/{id} -->
  <rect x="250" y="600" width="300" height="40" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="400" y="625" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /recordings/{id}</text>
  <text x="400" y="640" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Get recording details</text>
  
  <!-- ML Inference Section -->
  <rect x="800" y="150" width="700" height="200" rx="10" fill="#F8F9FA" stroke="#333" stroke-width="2"/>
  <rect x="800" y="150" width="700" height="40" rx="10" fill="url(#headerGrad)"/>
  <text x="1150" y="175" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">ML Inference</text>
  
  <!-- POST /models/train -->
  <rect x="830" y="210" width="300" height="60" rx="5" fill="url(#postGrad)" stroke="#E8A84A" stroke-width="2"/>
  <text x="980" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">POST /models/train</text>
  <text x="980" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Start model training</text>
  
  <!-- GET /models/{job_id}/status -->
  <rect x="1170" y="210" width="300" height="60" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="1320" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /models/{job_id}/status</text>
  <text x="1320" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Get training status</text>
  
  <!-- GET /models -->
  <rect x="1000" y="290" width="300" height="50" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="1150" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /models</text>
  <text x="1150" y="335" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">List all model runs</text>
  
  <!-- Health Monitoring Section -->
  <rect x="800" y="400" width="700" height="150" rx="10" fill="#F8F9FA" stroke="#333" stroke-width="2"/>
  <rect x="800" y="400" width="700" height="40" rx="10" fill="url(#headerGrad)"/>
  <text x="1150" y="425" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Health Monitoring</text>
  
  <!-- GET /health -->
  <rect x="1000" y="460" width="300" height="80" rx="5" fill="url(#getGrad)" stroke="#44A08D" stroke-width="2"/>
  <text x="1150" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">GET /health</text>
  <text x="1150" y="515" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Health check endpoint</text>
  <text x="1150" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">No authentication required</text>
  
  <!-- Request/Response Examples -->
  <rect x="50" y="700" width="1450" height="450" rx="10" fill="#F8F9FA" stroke="#333" stroke-width="2"/>
  <rect x="50" y="700" width="1450" height="40" rx="10" fill="url(#headerGrad)"/>
  <text x="775" y="725" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Request/Response Examples</text>
  
  <!-- Example 1: Create Patient -->
  <rect x="80" y="760" width="450" height="180" rx="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="305" y="785" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">POST /patients</text>
  <line x1="80" y1="795" x2="530" y2="795" stroke="#333" stroke-width="1"/>
  
  <text x="90" y="815" font-family="Courier, monospace" font-size="11" fill="#666">Request Body:</text>
  <text x="90" y="835" font-family="Courier, monospace" font-size="10" fill="#333">{</text>
  <text x="100" y="850" font-family="Courier, monospace" font-size="10" fill="#333">  "name": "John Doe",</text>
  <text x="100" y="865" font-family="Courier, monospace" font-size="10" fill="#333">  "age": 72,</text>
  <text x="100" y="880" font-family="Courier, monospace" font-size="10" fill="#333">  "conditions": "COPD;Hypertension"</text>
  <text x="90" y="895" font-family="Courier, monospace" font-size="10" fill="#333">}</text>
  
  <text x="90" y="920" font-family="Courier, monospace" font-size="11" fill="#666">Response: 201 Created</text>
  
  <!-- Example 2: Upload Recording -->
  <rect x="580" y="760" width="450" height="180" rx="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="805" y="785" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">POST /recordings</text>
  <line x1="580" y1="795" x2="1030" y2="795" stroke="#333" stroke-width="1"/>
  
  <text x="590" y="815" font-family="Courier, monospace" font-size="11" fill="#666">Form Data:</text>
  <text x="590" y="835" font-family="Courier, monospace" font-size="10" fill="#333">patient_id: 1</text>
  <text x="590" y="850" font-family="Courier, monospace" font-size="10" fill="#333">device_id: wifi_nexmon</text>
  <text x="590" y="865" font-family="Courier, monospace" font-size="10" fill="#333">file: @recording.json</text>
  
  <text x="590" y="895" font-family="Courier, monospace" font-size="11" fill="#666">Response: 201 Created</text>
  <text x="590" y="910" font-family="Courier, monospace" font-size="10" fill="#333">{ "id": 1, "status": "uploaded" }</text>
  
  <!-- Example 3: Get Metrics -->
  <rect x="1080" y="760" width="400" height="180" rx="5" fill="white" stroke="#333" stroke-width="1"/>
  <text x="1280" y="785" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">GET /recordings/1/metrics</text>
  <line x1="1080" y1="795" x2="1480" y2="795" stroke="#333" stroke-width="1"/>
  
  <text x="1090" y="815" font-family="Courier, monospace" font-size="11" fill="#666">Response: 200 OK</text>
  <text x="1090" y="835" font-family="Courier, monospace" font-size="10" fill="#333">{</text>
  <text x="1100" y="850" font-family="Courier, monospace" font-size="10" fill="#333">  "respiration_rate": 16.5,</text>
  <text x="1100" y="865" font-family="Courier, monospace" font-size="10" fill="#333">  "heart_rate": 75.2,</text>
  <text x="1100" y="880" font-family="Courier, monospace" font-size="10" fill="#333">  "hrv": 35.8,</text>
  <text x="1100" y="895" font-family="Courier, monospace" font-size="10" fill="#333">  "activity_label": "normal",</text>
  <text x="1100" y="910" font-family="Courier, monospace" font-size="10" fill="#333">  "risk_score": 25.0</text>
  <text x="1090" y="925" font-family="Courier, monospace" font-size="10" fill="#333">}</text>
  
  <!-- Error Responses -->
  <rect x="80" y="970" width="1400" height="160" rx="5" fill="#FFF5F5" stroke="#E74C3C" stroke-width="1"/>
  <text x="780" y="995" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#E74C3C">Error Responses</text>
  
  <text x="100" y="1020" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">400 Bad Request:</text>
  <text x="100" y="1040" font-family="Courier, monospace" font-size="10" fill="#666">{ "error_code": "VALIDATION_ERROR", "message": "Invalid input" }</text>
  
  <text x="100" y="1070" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">401 Unauthorized:</text>
  <text x="100" y="1090" font-family="Courier, monospace" font-size="10" fill="#666">{ "error_code": "UNAUTHORIZED", "message": "Invalid or missing token" }</text>
  
  <text x="600" y="1020" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">404 Not Found:</text>
  <text x="600" y="1040" font-family="Courier, monospace" font-size="10" fill="#666">{ "error_code": "NOT_FOUND", "message": "Resource not found" }</text>
  
  <text x="600" y="1070" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">500 Internal Server Error:</text>
  <text x="600" y="1090" font-family="Courier, monospace" font-size="10" fill="#666">{ "error_code": "INTERNAL_ERROR", "message": "Server error" }</text>
  
  <!-- Legend -->
  <rect x="1200" y="60" width="300" height="80" rx="5" fill="#F8F9FA" stroke="#333" stroke-width="1"/>
  <text x="1350" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">HTTP Methods</text>
  <rect x="1220" y="95" width="20" height="15" rx="2" fill="url(#getGrad)"/>
  <text x="1250" y="106" font-family="Arial, sans-serif" font-size="11" fill="#333">GET</text>
  <rect x="1280" y="95" width="20" height="15" rx="2" fill="url(#postGrad)"/>
  <text x="1310" y="106" font-family="Arial, sans-serif" font-size="11" fill="#333">POST</text>
</svg>




