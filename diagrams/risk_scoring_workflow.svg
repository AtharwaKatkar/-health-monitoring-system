<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="1400" height="1000" fill="white"/>
  <defs>
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74B9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984E3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A29BFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6C5CE7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#55EFC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B894;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDCB6E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A84A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="highGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55555;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Risk Scoring Workflow</text>
  
  <!-- Input Metrics -->
  <rect x="50" y="80" width="200" height="120" rx="10" fill="url(#inputGrad)" stroke="#0575C4" stroke-width="2"/>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Input Metrics</text>
  <text x="150" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Respiration Rate</text>
  <text x="150" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Heart Rate</text>
  <text x="150" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">HRV, Activity</text>
  
  <!-- Respiration Risk Calculation -->
  <rect x="300" y="80" width="250" height="120" rx="10" fill="url(#processGrad)" stroke="#5A4FCF" stroke-width="2"/>
  <text x="425" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Respiration Risk</text>
  <text x="425" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Weight: 40%</text>
  <text x="425" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Normal: 12-20 bpm</text>
  <text x="425" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Risk: +30 if abnormal</text>
  
  <!-- Cardiac Risk Calculation -->
  <rect x="600" y="80" width="250" height="120" rx="10" fill="url(#processGrad)" stroke="#5A4FCF" stroke-width="2"/>
  <text x="725" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Cardiac Risk</text>
  <text x="725" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Weight: 40%</text>
  <text x="725" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">HR: 60-100 bpm</text>
  <text x="725" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">HRV: +20 if &lt;20</text>
  
  <!-- Mobility Risk Calculation -->
  <rect x="900" y="80" width="250" height="120" rx="10" fill="url(#processGrad)" stroke="#5A4FCF" stroke-width="2"/>
  <text x="1025" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Mobility Risk</text>
  <text x="1025" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Weight: 20%</text>
  <text x="1025" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Fall: +50</text>
  <text x="1025" y="175" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Walking/Standing: +10</text>
  
  <!-- Arrows -->
  <path d="M 250 140 L 300 140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 140 L 725 140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 140 L 1025 140" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Risk Score Calculation -->
  <rect x="400" y="280" width="400" height="120" rx="10" fill="url(#processGrad)" stroke="#5A4FCF" stroke-width="3"/>
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">Risk Score Calculation</text>
  <text x="600" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Total Risk = Respiration Risk + Cardiac Risk + Mobility Risk</text>
  <text x="600" y="375" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Score Range: 0-100</text>
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(Capped at maximum of 100)</text>
  
  <!-- Arrows to Risk Score -->
  <path d="M 425 200 L 500 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 725 200 L 600 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1025 200 L 700 280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Risk Level Classification -->
  <rect x="200" y="480" width="800" height="80" rx="10" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Risk Level Classification</text>
  
  <!-- Low Risk -->
  <rect x="250" y="530" width="150" height="20" rx="5" fill="url(#lowGrad)" stroke="#00A085" stroke-width="1"/>
  <text x="325" y="544" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Low Risk: 30-60</text>
  
  <!-- Medium Risk -->
  <rect x="450" y="530" width="150" height="20" rx="5" fill="url(#medGrad)" stroke="#D4A047" stroke-width="1"/>
  <text x="525" y="544" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Medium Risk: 60-80</text>
  
  <!-- High Risk -->
  <rect x="650" y="530" width="150" height="20" rx="5" fill="url(#highGrad)" stroke="#E55555" stroke-width="1"/>
  <text x="725" y="544" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">High Risk: 80-100</text>
  
  <!-- Arrow from Risk Score to Classification -->
  <path d="M 600 400 L 600 480" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Alert Generation -->
  <rect x="200" y="620" width="800" height="120" rx="10" fill="#FFF5F5" stroke="#E74C3C" stroke-width="2"/>
  <text x="600" y="655" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#E74C3C">Alert Generation</text>
  
  <!-- Low Alert -->
  <rect x="250" y="680" width="200" height="50" rx="5" fill="url(#lowGrad)" stroke="#00A085" stroke-width="2"/>
  <text x="350" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Low Alert</text>
  <text x="350" y="722" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Monitor &amp; Log</text>
  
  <!-- Medium Alert -->
  <rect x="500" y="680" width="200" height="50" rx="5" fill="url(#medGrad)" stroke="#D4A047" stroke-width="2"/>
  <text x="600" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Medium Alert</text>
  <text x="600" y="722" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Notify Caregiver</text>
  
  <!-- High Alert -->
  <rect x="750" y="680" width="200" height="50" rx="5" fill="url(#highGrad)" stroke="#E55555" stroke-width="2"/>
  <text x="850" y="705" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">High Alert</text>
  <text x="850" y="722" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Emergency Response</text>
  
  <!-- Arrow from Classification to Alerts -->
  <path d="M 600 560 L 600 620" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Decision Tree -->
  <rect x="50" y="800" width="1300" height="160" rx="10" fill="#F8F9FA" stroke="#333" stroke-width="1"/>
  <text x="700" y="830" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Decision Logic</text>
  
  <text x="100" y="860" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Respiration Check:</text>
  <text x="100" y="880" font-family="Courier, monospace" font-size="10" fill="#666">if respiration_rate &lt; 12 or &gt; 20: risk += 30</text>
  
  <text x="100" y="910" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Cardiac Check:</text>
  <text x="100" y="930" font-family="Courier, monospace" font-size="10" fill="#666">if heart_rate &lt; 60 or &gt; 100: risk += 30</text>
  <text x="100" y="950" font-family="Courier, monospace" font-size="10" fill="#666">if hrv &lt; 20: risk += 20</text>
  
  <text x="600" y="860" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Mobility Check:</text>
  <text x="600" y="880" font-family="Courier, monospace" font-size="10" fill="#666">if activity == "fall": risk += 50</text>
  <text x="600" y="900" font-family="Courier, monospace" font-size="10" fill="#666">elif activity in ["walking", "standing"]: risk += 10</text>
  
  <text x="1000" y="860" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Final Score:</text>
  <text x="1000" y="880" font-family="Courier, monospace" font-size="10" fill="#666">risk_score = min(100, total_risk)</text>
  <text x="1000" y="900" font-family="Courier, monospace" font-size="10" fill="#666">alert_level = classify(risk_score)</text>
  
  <!-- Example Scenarios -->
  <rect x="50" y="200" width="300" height="60" rx="5" fill="#E8F4F8" stroke="#4A90E2" stroke-width="1"/>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Example Scenario 1</text>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">RR: 18, HR: 75, Activity: normal</text>
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Risk Score: 0 (Low Risk)</text>
  
  <rect x="1050" y="200" width="300" height="60" rx="5" fill="#FFF5F5" stroke="#E74C3C" stroke-width="1"/>
  <text x="1200" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Example Scenario 2</text>
  <text x="1200" y="245" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">RR: 25, HR: 110, Activity: fall</text>
  <text x="1200" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Risk Score: 100 (High Risk)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
</svg>




